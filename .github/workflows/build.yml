# Construit ShuttleOSC pour Windows, macOS (Apple Silicon et Intel) et Linux.

name: Build ShuttleOSC

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # necessaire pour publier la Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: ShuttleOSC-windows-x64
          - os: macos-15
            name: ShuttleOSC-macos-apple-silicon
          - os: macos-15-intel
            name: ShuttleOSC-macos-intel
          - os: ubuntu-22.04          # glibc ancienne = compatible avec plus de distributions
            name: ShuttleOSC-linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Dependances
        run: python -m pip install hidapi python-osc pyinstaller

      - name: Executable
        run: pyinstaller --onefile --name ShuttleOSC shuttle_osc.py

      - name: Paquet (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p pkg && cp dist/ShuttleOSC UTILISATION.txt pkg/
          chmod +x pkg/ShuttleOSC
          if [ "$RUNNER_OS" = "Linux" ]; then cp 99-shuttlexpress.rules pkg/; fi
          cd pkg && zip -r "../${{ matrix.name }}.zip" .

      - name: Paquet (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist/ShuttleOSC.exe, UTILISATION.txt pkg/
          Compress-Archive -Path pkg/* -DestinationPath "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.zip
